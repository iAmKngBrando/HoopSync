[project]
name = "twokot-server"
version = "0.1.0"
description = "Local API, storage and screen-reading pipeline for the 2KOT opponent tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "rapidocr-onnxruntime>=1.4.4",
    "onnxruntime<1.24",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twokot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# B008: FastAPI declares request parts as call defaults (File(...), Form(...)).
# TRY004: a malformed export file is a bad value, not a programming type error.
ignore = ["B008", "TRY004"]
